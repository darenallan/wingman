services:
  - type: web
    name: wingman-v2-api
    env: node
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Mot de passe de l'app (12 caractères min.) : à saisir dans le tableau de bord
      - key: WINGMAN_PASSWORD
        sync: false
      # Signature des sessions, générée par Render
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
